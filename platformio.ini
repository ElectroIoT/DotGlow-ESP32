; DotGlow -- WiFi + Bluetooth LED matrix clock for ESP32 / ESP32-S3 + MAX7219
[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; two ~1.9 MB app slots: room for WiFi + HTTPS + web + Bluetooth, and OTA updates
board_build.partitions = min_spiffs.csv
lib_deps =
    majicdesigns/MD_MAX72XX @ ^3.5.1
    h2zero/NimBLE-Arduino @ ^1.4.3
    bblanchon/ArduinoJson @ ^7.2.0

; classic ESP32 DevKit (WROOM-32): CLK GPIO18, DIN GPIO23, CS GPIO5
[env:esp32dev]
board = esp32dev

; ESP32-S3 DevKitC-1: CLK GPIO12, DIN GPIO11, CS GPIO10
; Serial log on the native USB port (the "USB" connector, COM port 303A:1001).
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
