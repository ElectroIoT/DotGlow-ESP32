# Publishes the browser flasher to GitHub Pages: https://electroiot.github.io/DotGlow-ESP32/
# Run it again (Actions tab) after publishing a firmware release, so the page offers the new version.
name: Web flasher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web-flasher/**', '.github/workflows/web-flasher.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site from the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python web-flasher/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
