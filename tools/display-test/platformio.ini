; DotGlow display test: checks the MAX7219 wiring and power without the clock firmware.
;   cd tools/display-test
;   python -m platformio run -e esp32dev -t upload       (ESP32 DevKit: DIN 23, CS 5, CLK 18)
;   python -m platformio run -e esp32s3 -t upload        (ESP32-S3:     DIN 11, CS 10, CLK 12)
;   python -m platformio device monitor -b 115200        (the report)
; Afterwards install the real firmware again (app: Install firmware, or pio in the main folder).

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
